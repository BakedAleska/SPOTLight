# Light CI: unit tests, builds, and the DB tests on a throwaway pgvector service container. No secrets (no
# GEMINI_API_KEY: Gemini is respx-mocked), no model weights, nothing pushed.
# Local equivalents: make test-policy / test-compose / test-backend / test-mcp / test-system1-fast / test-system2 /
# test-gateway / test-vision / test-contract / test-orchestrator / test-chat-contract, make test-chat-db / test-graph /
# test-db (against the compose Postgres), make test-web (web/: lint + test:chat + test:flags), and
# `npm ci && npm run build` in web/. The only download beyond packages is the ~30 MB RapidOCR ONNX set (cached; the
# vision image bakes it in). Left out on purpose (heavy or needs the stack): real-Laya system1 tests, the backend
# integration test, e2e, the graph tests that need ingested documents or a live embed service, and the torch images
# (embed, system1). See docs/RUNNING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: backend + policy/compose drift guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Policy drift guard (make test-policy)
        run: python -m pytest tests/test_policy_consistency.py -q -p no:cacheprovider
      # Static: compose vs its header table vs the contract/RUNNING.md port tables, healthchecks, depends_on, BIND_ADDR.
      - name: Compose drift guard (make test-compose)
        run: python -m pytest tests/test_compose_consistency.py -q -p no:cacheprovider
      # Includes tests/test_system2_integration.py, which imports amd/system2 from this checkout, and the chat unit
      # tests (tests/test_chat_*.py: FakeChatRepo + respx-mocked Gemini, so no GEMINI_API_KEY).
      - name: Backend unit tests (make test-backend; DB integration tests skipped)
        working-directory: backend
        env:
          SKIP_INTEGRATION: "1"
        run: python -m pytest -q -p no:cacheprovider

  chat-contract:
    name: chat contract (golden SSE, backend side)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt
      # Real backend turns (app + ChatService + grounding, FakeChatRepo, respx-mocked Gemini) vs
      # tests/contract/chat_golden/, plus the shared citation fixtures (chat_citations.json). The web job replays the
      # same goldens through the real proxy route, SSE parser and store (web/tests/chat-contract.test.ts).
      - name: Chat cross-layer contract (make test-chat-contract)
        run: python -m pytest tests/contract/test_chat_contract.py -q -p no:cacheprovider

  chat-db:
    name: db integration (chat, graph, seed) on pgvector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same image as docker-compose.yml's db. The tests create (and drop) their own spot_*test_<hex> databases and
    # roles; there is no `spot` database here, so the graph tests that need ingested documents skip, and the vector
    # paths use the synthetic vectors the tests insert (no embed service).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres   # throwaway CI database, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_PORT: "5432"
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # The backend venv runs these locally too (make test-chat-db / test-graph / test-db): psycopg + pool + pytest.
      - name: Install
        run: python -m pip install -r backend/requirements-dev.txt
      # The DB tests skip (not fail) when Postgres is unreachable, so prove it is up, with pgvector, first.
      - name: Postgres + pgvector reachable
        run: |
          python - <<'EOF'
          import os, psycopg
          url = "postgresql://postgres:%s@localhost:%s/postgres" % (os.environ["POSTGRES_PASSWORD"], os.environ["DB_PORT"])
          with psycopg.connect(url, connect_timeout=10) as c:
              print(c.execute("SELECT version()").fetchone()[0])
              assert c.execute("SELECT 1 FROM pg_available_extensions WHERE name = 'vector'").fetchone(), "no pgvector"
          EOF
      # 010/011 migrations twice, ChatRepo as a spot_app member, spot_mcp_reader can't read chats.
      - name: Chat DB tests (make test-chat-db)
        run: python -m pytest db/tests/test_chat.py -q -p no:cacheprovider -rs
      - name: Knowledge graph DB tests (make test-graph)
        run: python -m pytest db/tests/test_graph.py -q -p no:cacheprovider -rs
      # The 0.50 similarity floor on hybrid document search, with synthetic vectors (skipped in the backend job).
      - name: Chat retrieval floor (DB)
        working-directory: backend
        run: python -m pytest tests/test_chat_retrieval_floor.py -q -p no:cacheprovider -rs
      - name: Seed is non-destructive (make test-db)
        run: python -m pytest tests/test_seed_nondestructive.py -q -p no:cacheprovider -rs
      # migrate twice + seed on a throwaway database: analytics, enriched events, 014/015, reset, login roles.
      - name: Setup/migrations DB tests
        run: python -m pytest db/tests/test_setup.py -q -p no:cacheprovider -rs

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amd/mcp/requirements.txt
      - name: Install
        run: python -m pip install -r amd/mcp/requirements.txt pytest anyio
      # tests/test_integration.py skips itself without DATABASE_URL + EMBED_URL.
      - name: MCP unit tests (make test-mcp)
        working-directory: amd/mcp
        run: python -m pytest -q -p no:cacheprovider

  system2:
    name: system2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amd/system2/requirements.txt
      - name: Install
        run: python -m pip install -r amd/system2/requirements.txt
      # tests/test_container.py skips itself unless SYSTEM2_CONTAINER_TEST=1.
      - name: System 2 tests
        working-directory: amd/system2
        run: python -m pytest -q -p no:cacheprovider tests

  gateway:
    name: gateway (LiteLLM, hashed lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # the hashed lock is compiled for 3.12, like the image
          cache: pip
          cache-dependency-path: amd/gateway/requirements*.txt
      # Same install as the Dockerfile: --require-hashes refuses any wheel whose hash differs from the lock.
      - name: Install (hash-locked)
        run: |
          python -m pip install --require-hashes -r amd/gateway/requirements.txt
          python -m pip install -r amd/gateway/requirements-dev.txt
      # Includes the e2e: starts the real proxy (serve.py) as a subprocess against local stub upstreams.
      - name: Gateway tests (make test-gateway)
        working-directory: amd/gateway
        run: python -m pytest -q -p no:cacheprovider

  vision:
    name: vision + cross-service contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            amd/vision/requirements*.txt
            tests/contract/requirements.txt
      # tests/contract/requirements.txt = the vision pins + what orchestrator.assess imports (langgraph, httpx).
      - name: Install
        run: python -m pip install -r amd/vision/requirements-dev.txt -r tests/contract/requirements.txt
      # RapidOCR keeps its ONNX models in its package dir and downloads them on first use (sha256-checked, skipped
      # when present), so cache that dir per rapidocr pin; fetch_models.py then only verifies + smoke-tests OCR.
      - name: Locate the RapidOCR model dir
        id: ocr
        run: echo "dir=$(python -c 'import pathlib, rapidocr; print(pathlib.Path(rapidocr.__file__).parent / "models")')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ${{ steps.ocr.outputs.dir }}
          key: rapidocr-models-${{ runner.os }}-${{ hashFiles('amd/vision/requirements.txt') }}
      - name: Fetch + verify OCR models (scripts/fetch_models.py)
        working-directory: amd/vision
        run: python scripts/fetch_models.py
      # All 100, including the `slow` all-Orbit-screenshots sweep; the kit images are tracked under SPOTDATA/.
      - name: Vision tests (make test-vision)
        working-directory: amd/vision
        run: python -m pytest tests -q -p no:cacheprovider
      # tests/contract/test_chat_contract.py skips itself here (no backend deps); the chat-contract job runs it.
      - name: Vision -> orchestrator -> System 2 contract (make test-contract)
        run: python -m pytest tests/contract -q -p no:cacheprovider

  orchestrator:
    name: orchestrator (LangGraph)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amd/orchestrator/requirements*.txt
      - name: Install
        run: python -m pip install -r amd/orchestrator/requirements-dev.txt
      # Fakes for MCP/gateway/vision; tests/test_system2_contract.py runs the REAL amd/system2 app from this checkout.
      - name: Orchestrator tests (make test-orchestrator)
        working-directory: amd/orchestrator
        run: python -m pytest -q -p no:cacheprovider

  system1:
    name: system1 service (fast, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amd/system1/service/requirements*.txt
      # With SYSTEM1_SKIP_MODEL=1 nothing imports torch/laya (service/app.py loads the engine lazily and
      # test_parity.py skips), so install the service deps without laya/transformers/huggingface_hub.
      - name: Install (no torch)
        run: |
          grep -v -E '^(laya|transformers|huggingface_hub)[=<>~ ]' amd/system1/service/requirements.txt \
            > "$RUNNER_TEMP/system1-fast.txt"
          python -m pip install -r "$RUNNER_TEMP/system1-fast.txt" "pytest>=8" "httpx>=0.27"
      - name: System 1 service tests (make test-system1-fast)
        working-directory: amd/system1
        env:
          SYSTEM1_SKIP_MODEL: "1"
        run: python -m pytest service/tests -q -p no:cacheprovider

  web:
    name: web (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsx + node:test, offline (fetch is stubbed). test:chat includes chat-contract.test.ts, which replays the
      # backend's golden SSE transcripts (tests/contract/chat_golden/) through the real proxy route, parser and store.
      - run: npm run test:chat
      - run: npm run test:flags
      - run: npm run test:live
      # Needs network for next/font/google (Fira Sans, Fira Code); no env or secrets.
      - run: npm run build

  docker:
    name: compose config + light image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No .env in CI: every variable has a default, so this needs no secrets. Each profile (read from the file, so a
      # new one is never missed) plus the documented neon,models pair, with no env file and with .env.example.
      - name: Validate docker-compose.yml for every profile
        run: |
          for p in $(docker compose config --profiles) neon,models; do
            echo "COMPOSE_PROFILES=$p"
            COMPOSE_PROFILES="$p" docker compose config --quiet
            COMPOSE_PROFILES="$p" docker compose --env-file .env.example config --quiet
          done
      # Same build context and Dockerfile as docker-compose.yml. The torch images (embed, system1) are not built here.
      - name: Build backend (context ., backend/Dockerfile)
        run: docker build -f backend/Dockerfile -t spot-backend:ci .
      - name: Build db-init (context ., db/Dockerfile)
        run: docker build -f db/Dockerfile -t spot-db:ci .
      - name: Build mcp (context amd/mcp)
        run: docker build -t spot-mcp:ci amd/mcp
      - name: Build system2 (context amd/system2)
        run: docker build -t spot-system2:ci amd/system2
      - name: Build web (context web)
        run: docker build -t spot-web:ci web
      - name: Build live-runner (context ., scripts/live_runner.Dockerfile)
        run: docker build -f scripts/live_runner.Dockerfile -t spot-live-runner:ci .

  docker-build:
    name: image ${{ matrix.service }} (build + healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Same build context as docker-compose.yml. Each image refuses to start without its key; these are throwaway
        # CI values, not secrets.
        include:
          - service: gateway
            key_env: LITELLM_MASTER_KEY=sk-ci-gateway-key-0123456789
          - service: vision
            key_env: VISION_API_KEY=ci-vision-key-0123456789
          - service: orchestrator
            key_env: ORCHESTRATOR_API_KEY=ci-orchestrator-key-0123456789
    env:
      DOCKER_BUILDKIT: "1"
      SERVICE: ${{ matrix.service }}
      KEY_ENV: ${{ matrix.key_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # gateway: --require-hashes install; vision: bakes + smoke-tests the OCR models at build time.
      - name: Build (context amd/${{ matrix.service }})
        run: docker build -t "spot-$SERVICE:ci" "amd/$SERVICE"
      # Starts the image with no upstreams and waits for its own HEALTHCHECK: catches a missing file, a bad CMD or
      # a root user that a build alone would not.
      - name: Start and wait for the image HEALTHCHECK
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' "spot-$SERVICE:ci")
          case "$user" in ""|root|root:*|0|0:*) echo "spot-$SERVICE runs as root ('$user')"; exit 1;; esac
          docker run -d --name "$SERVICE" -e "$KEY_ENV" "spot-$SERVICE:ci"
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$SERVICE")
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' "$SERVICE")" = true ] || break
            sleep 3
          done
          docker logs "$SERVICE"
          exit 1
