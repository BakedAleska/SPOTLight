; SPOT GPU services on the AMD box (docs/AMD-K8S-PLAN.md Path B), installed to /root/supervisord.conf by setup.sh.
; Loopback only: the laptop reaches them through ../laptop/tunnel.sh (the platform sshd refuses -L forwarding).
;   /root/venv-gpu/bin/supervisorctl -c /root/supervisord.conf status | restart <name> | tail -f <name>
[supervisord]
logfile=/root/logs/supervisord.log
pidfile=/root/supervisord.pid
childlogdir=/root/logs
[unix_http_server]
file=/root/supervisor.sock
[supervisorctl]
serverurl=unix:///root/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:llm]
; Qwen3.8-27B Q8_0 + mmproj (docs/AMD-RUNS-2026-10-10.md §4); llama.cpp built against ROCm 7.14.1 in /root/venv-rocm.
; -rea off: Qwen3.8 thinks by default, which would burn System 2's 350-token budget.
command=/root/llama.cpp/build/bin/llama-server -m /root/models/q38-27b/Qwen3.8-27B-Q8_0.gguf --mmproj /root/models/q38-27b/mmproj-F16.gguf --image-max-tokens 1024 -ngl all -fa on -c 16384 -np 1 -rea off --host 127.0.0.1 --port 8080 --metrics
environment=LD_LIBRARY_PATH="/root/venv-rocm/lib/python3.14/site-packages/_rocm_sdk_devel/lib:/root/venv-rocm/lib/python3.14/site-packages/_rocm_sdk_core/lib"
autostart=true ; llm
autorestart=true
startsecs=20
stdout_logfile=/root/logs/llm.log
redirect_stderr=true

[program:embed]
directory=/root/SpotTheDOT/amd/embed
command=/bin/bash -c "set -a; . /root/spot.env; exec /root/venv-gpu/bin/python server.py"
environment=EMBED_MODEL="Qwen/Qwen3-Embedding-0.6B",EMBED_DIM="1024",EMBED_HOST="127.0.0.1",EMBED_PORT="8081"
autorestart=true
startsecs=10
stdout_logfile=/root/logs/embed.log
redirect_stderr=true

[program:system1]
; The fine-tuned Laya is installed by ../laptop/push_laya.sh; until then (or if it fails to load) base Laya serves.
directory=/root/SpotTheDOT/amd/system1
command=/bin/bash -c "set -a; . /root/spot.env; exec /root/venv-gpu/bin/python -m service"
environment=LAYA_CHECKPOINT="/root/models/checkpoints/run4_B_lora_lr4/best",LAYA_CHECKPOINT_SUBDIR="",LAYA_FALLBACK_CHECKPOINT="convaiinnovations/laya",LAYA_DEVICE="auto",SPOT_AMP="1",HOST="127.0.0.1",PORT="8082"
autorestart=true
startsecs=10
stdout_logfile=/root/logs/system1.log
redirect_stderr=true
